appId: com.cbswitcher.app
productName: Buddy-Switcher
directories:
  output: dist
files:
  - main.js
  - preload.js
  - renderer/**
mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  target:
    - portable
    - nsis
nsis:
  oneClick: true
  perMachine: false