<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
  <title>Buddy-Switcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-switch" viewBox="0 0 24 24">
      <path d="M4 8h13m0 0-3.2-3.2M17 8l-3.2 3.2M20 16H7m0 0 3.2-3.2M7 16l3.2 3.2" />
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
      <path d="M12 5.5v13M5.5 12h13" />
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24">
      <path d="M20 12a8 8 0 1 1-2.34-5.66M20 4.5V10h-5.5" />
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
      <path d="M4 7h16M10 4h4M7.5 7l.8 12.5h7.4L16.5 7M10.5 11v5M13.5 11v5" />
    </symbol>
    <symbol id="i-folder" viewBox="0 0 24 24">
      <path d="M3.5 7.5A1.5 1.5 0 0 1 5 6h4l2 2.5h8a1.5 1.5 0 0 1 1.5 1.5v7A1.5 1.5 0 0 1 19 18.5H5A1.5 1.5 0 0 1 3.5 17z" />
    </symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24">
      <path d="M7 18h9.5a3.5 3.5 0 0 0 .3-6.99A5 5 0 0 0 7.1 9.6 3.8 3.8 0 0 0 7 18z" />
      <path d="M12 15v-4m0 0-1.6 1.7M12 11l1.6 1.7" />
    </symbol>
  </svg>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">
          <svg class="icon" aria-hidden="true"><use href="#i-switch"></use></svg>
        </span>
        <div class="brand-text">
          <h1>Buddy-Switcher</h1>
          <p>账号切换器</p>
        </div>
      </div>

      <div class="seg" id="product-switch" role="tablist" aria-label="选择应用"></div>

      <button id="open-sync" class="btn primary small" type="button">
        <svg class="icon" aria-hidden="true"><use href="#i-cloud"></use></svg>
        跨设备同步
      </button>
    </header>

    <main class="content">
      <div class="surface">
        <section class="section">
          <div class="section-head">
            <div class="section-title">
              <h2>账号档案</h2>
              <span class="status" id="app-state" data-state="unknown">
                <span class="dot"></span>
                <span id="app-state-text">检测中</span>
              </span>
            </div>
            <div class="section-actions">
              <span class="count" id="accounts-sub"></span>
              <button id="new-account" class="btn ghost small" type="button" title="清空当前登录，用另一个账号重新登录">新建账号</button>
              <button id="refresh" class="icon-btn" type="button" title="刷新" aria-label="刷新">
                <svg class="icon" aria-hidden="true"><use href="#i-refresh"></use></svg>
              </button>
            </div>
          </div>

          <div id="profile-list" class="profile-list"></div>

          <div id="empty-state" class="empty" hidden>
            <ol class="steps">
              <li>
                <span class="step-no">1</span>
                <div><b>登录账号 A</b><span>在 <span data-app>CodeBuddy Desktop</span> 里登录</span></div>
              </li>
              <li>
                <span class="step-no">2</span>
                <div><b>保存为档案</b><span>在下面输入名字，点保存</span></div>
              </li>
              <li>
                <span class="step-no">3</span>
                <div><b>加第二个账号</b><span>点「新建账号」清空登录再登 B，别用退出登录（会吊销凭据）</span></div>
              </li>
            </ol>
          </div>
        </section>

        <section class="section">
          <div class="section-head">
            <h2>保存当前账号</h2>
            <span class="count">会先弹窗确认，保存后自动重启</span>
          </div>
          <form id="save-form" class="save-row" autocomplete="off">
            <input id="new-name" type="text" maxlength="32" placeholder="档案名，如 工作 / 个人" aria-label="档案名" />
            <button id="save-new" type="submit" class="btn primary">
              <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
              保存
            </button>
          </form>
        </section>

        <section class="section">
          <div class="section-head">
            <h2>操作日志</h2>
            <button id="clear-log" class="link-btn" type="button">清空</button>
          </div>
          <div id="log" class="log" role="log" aria-live="polite"></div>
        </section>
      </div>
    </main>

    <footer class="footer">
      <button id="open-folder" class="link-btn" type="button">
        <svg class="icon" aria-hidden="true"><use href="#i-folder"></use></svg>
        打开档案目录
      </button>
      <span class="path" id="profiles-root" title=""></span>
      <span class="version" id="version">v1.0.0</span>
    </footer>

    <div class="modal" id="sync-modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="sync-title">
        <div class="modal-head">
          <h2 id="sync-title">跨设备同步</h2>
          <button id="sync-close" class="icon-btn" type="button" aria-label="关闭">✕</button>
        </div>
        <p class="hint">档案用 WebDAV 密码加密后上传，服务器上只有密文。开启自动同步后会定时「先拉后传」，两台机器各自补齐对方的档案。</p>
        <div class="fields">
          <label>服务器地址<input id="sync-url" type="text" placeholder="https://dav.jianguoyun.com/dav/" /></label>
          <label>用户名<input id="sync-user" type="text" placeholder="WebDAV 账号" /></label>
          <label>密码<input id="sync-pass" type="password" placeholder="留空表示不修改" /></label>
          <label>远程目录<input id="sync-dir" type="text" placeholder="buddy-switcher" /></label>
          <div class="auto-row">
            <label class="check"><input id="sync-auto" type="checkbox" />自动同步</label>
            <select id="sync-every">
              <option value="5">每 5 分钟</option>
              <option value="15">每 15 分钟</option>
              <option value="30">每 30 分钟</option>
              <option value="60">每 60 分钟</option>
            </select>
          </div>
        </div>
        <p class="hint" id="sync-timer"></p>
        <div class="remote">
          <div class="remote-head">
            <span>远程档案</span>
            <button id="sync-refresh" class="link-btn" type="button">刷新</button>
          </div>
          <div class="remote-list" id="sync-remote">未连接</div>
          <p class="hint" id="sync-device"></p>
        </div>
        <div class="modal-actions">
          <button id="sync-test" class="btn ghost small" type="button">测试连接</button>
          <button id="sync-save" class="btn ghost small" type="button">保存配置</button>
          <span class="spacer"></span>
          <button id="sync-pull" class="btn ghost small" type="button">从远程拉取</button>
          <button id="sync-push" class="btn primary small" type="button">上传本机档案</button>
        </div>
        <p class="hint status" id="sync-status"></p>
      </div>
    </div>

    <div class="busy-bar" id="busy-bar" aria-hidden="true"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
