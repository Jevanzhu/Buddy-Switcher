appId: com.cbswitcher.app
productName: Buddy-Switcher
# 只留中英文语言包，其余 50 多个 pak 白占体积
electronLanguages:
  - zh-CN
  - en-US
# 极限压缩，portable 用最高档
compression: maximum
# 打包后删掉用不到的图形组件
afterPack: scripts/after-pack.js
directories:
  output: dist
  buildResources: build
files:
  - main.js
  - preload.js
  - sync.js
  - renderer/**
mac:
  icon: build/icon.icns
  category: public.app-category.utilities
  # 没有开发者证书时用 ad-hoc 签名，否则 Apple Silicon 上会提示应用已损坏
  identity: '-'
  # 不写死 arch，默认打当前机器的架构；交叉打包用 --arm64 / --x64 指定
  target:
    - dmg
    - zip
win:
  icon: build/icon.png
  target:
    - target: portable
      arch: [x64]
portable:
  artifactName: Buddy-Switcher-${version}-portable.${ext}
  requestExecutionLevel: user
  unpackDirName: Buddy-Switcher
